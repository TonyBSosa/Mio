<div class="login-container">
  <p class="auth-kicker">Forma parte de MIO</p><h1>{{ titulo }}</h1><p class="auth-intro">Tu próxima conexión empieza aquí.</p>

  <form (ngSubmit)="register()">
    <div class="form-group">
      <label for="nombre">Tu nombre</label>
      <input type="text" autocomplete="name" id="nombre" [(ngModel)]="nombre" name="nombre" required>
    </div>

    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input type="email" autocomplete="email" spellcheck="false" id="email" [(ngModel)]="email" name="email" required>
    </div>

    <div class="form-group">
      <label for="password">Contraseña (10 a 128 caracteres)</label>
      <input type="password" autocomplete="new-password" id="password" [(ngModel)]="password" name="password" minlength="10" maxlength="128" required>
    </div>

    <button type="submit" [disabled]="cargando">
      {{ cargando ? 'Creando cuenta…' : 'Crear mi cuenta' }}
    </button>
  </form>

  @if (mensaje) {
    <p class="mensaje" role="status">{{ mensaje }}</p>
  }

  <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
</div>
