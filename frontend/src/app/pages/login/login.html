<section class="auth-page" aria-labelledby="login-title">
  <div class="login-container">
    <div class="auth-header">
      <h1 id="login-title">Iniciar sesión</h1>
      <p class="auth-intro">
        Ingresa a tu cuenta de MIO para gestionar tu tienda o explorar catálogos.
      </p>
    </div>

    @if (mensaje) {
      <div class="auth-alert auth-alert--error" role="alert">
        <strong>No se pudo iniciar sesión</strong>
        <span>{{ mensaje }}</span>
      </div>
    }

    <form class="auth-form" (ngSubmit)="login()" novalidate>
      <div class="form-group">
        <label for="login-email">Correo electrónico</label>
        <input
          id="login-email"
          type="email"
          name="email"
          autocomplete="username"
          placeholder="nombre@ejemplo.com"
          [(ngModel)]="email"
          [disabled]="cargando"
          required
        />
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="login-password">Contraseña</label>
          <a class="forgot-inline" routerLink="/recuperar">¿Olvidaste tu contraseña?</a>
        </div>
        <div class="password-input-wrap">
          <input
            id="login-password"
            [type]="mostrarPassword ? 'text' : 'password'"
            name="password"
            autocomplete="current-password"
            placeholder="Tu contraseña"
            [(ngModel)]="password"
            [disabled]="cargando"
            required
          />
          <button
            type="button"
            class="btn-ghost password-toggle"
            (click)="alternarPassword()"
            [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            {{ mostrarPassword ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
      </div>

      <button type="submit" class="auth-submit-btn" [disabled]="cargando">
        {{ cargando ? 'Verificando...' : 'Iniciar sesión' }}
      </button>
    </form>

    <footer class="auth-footer">
      <p class="auth-footer__title">¿Aún no tienes una cuenta?</p>
      <div class="auth-footer__links">
        <a routerLink="/register-vendedor">Crear cuenta de vendedor</a>
        <span aria-hidden="true">·</span>
        <a routerLink="/register-cliente">Registrarme como comprador</a>
      </div>
    </footer>
  </div>
</section>
