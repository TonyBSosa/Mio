 

<div class="login-container">
  <p class="auth-kicker">Tu espacio en MIO</p><h1>Qué gusto verte de nuevo.</h1><p class="auth-intro">Entra para descubrir tiendas o continuar con tus ventas.</p>

  <form (ngSubmit)="login()">
    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input type="email" autocomplete="email" spellcheck="false" id="email" [(ngModel)]="email" name="email" required>
    </div>
    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" autocomplete="current-password" id="password" [(ngModel)]="password" name="password" required>
    </div>
    <button type="submit" [disabled]="cargando">
      {{ cargando ? 'Ingresando…' : 'Iniciar sesión' }}
    </button>
  </form>

  @if (mensaje) {
    <p class="mensaje" role="status">{{ mensaje }}</p>
  }

  <p class="forgot-link"><a routerLink="/recuperar">Olvidé mi contraseña</a></p><p>¿Quieres vender? <a routerLink="/register-vendedor">Crea tu cuenta</a></p>
  <p>¿Vienes a descubrir tiendas? <a routerLink="/register-cliente">Regístrate aquí</a></p>
</div>
